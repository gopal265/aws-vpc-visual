name: Composite Action
description: Install node and run test cases

inputs:
  node-version:
    required: true
    description: Node verison
    default: 24

outputs:
  node-version:
    description: node version used
    value: ${{ steps.node-version.outputs.version }}

runs:
  using: composite

  steps:
    - name: Install node
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
    
    - name: Install dependencies
      shell: bash
      run: npm ci
    
    - name: Run test cases
      shell: bash
      run: npm run test:run

    - name: Build version
      id: node-version
      shell: bash
      run: echo "version=$(node --version)" >> "$GITHUB_OUTPUT"