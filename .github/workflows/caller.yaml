name: Caller Workflow

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/reusable.yaml
    with:
      node_version: "24"
      test_command: "npm run test:run -- --reporter=junit --outputFile=junit.xml"
      build_command: "npm run build"
  
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      id-token: write
      contents: read
    environment: development
    env:
      AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-build-${{ needs.ci.outputs.build_version }}
      
      - name: Verify build
        run: ls -R

      - name: Show build versin
        run: "echo Build Version: ${{ needs.ci.outputs.build_version }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/${{ env.AWS_ROLE }}
          aws-region: ap-southeast-2
      
      - name: Deploy to S3
        run: |
          aws s3 sync . s3://my-react-staging-4585 --delete