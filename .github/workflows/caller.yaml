name: Caller Workflow

on:
  push:

jobs:
  ci:
    uses: ./.github/workflows/reusable.yaml
    with:
      node_version: "24"
      test_command: "npm run test:run"
      build_command: "npm run build"
  
  deploy:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-build
      
      - name: Verify build
        run: ls -R