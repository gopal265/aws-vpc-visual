name: Multi Job CI

on:
  workflow_dispatch: 

jobs:
  # Job 1
   Lint:
     runs-on: ubuntu-latest
     steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
        - run: npm install
        - run: npm run lint
  # Job 2
   Test:
     runs-on: ubuntu-latest
     steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
        - run: npm install
        - run: npm run test:run   
  # Job 3
   Build:
     runs-on: ubuntu-latest
     needs: ['Lint', 'Test']
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-node@v4
         with:
           node-version: 20
           cache: npm
       - run: npm install
       - run: npm run build   
       - uses: actions/upload-artifact@v4
         with:
            name: react-prod-build
            path: dist/ 
   