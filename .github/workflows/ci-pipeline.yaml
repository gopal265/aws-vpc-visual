name: AWS CI Pipeline

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm ci

      - name: Run Test cases
        run: npm run test:run
    
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build the application
        run: npm run build
      
      - name: Upload the Build
        uses: actions/upload-artifact@v4
        with:
          name: prod-build
          path: dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: prod-build
          path: ./app
        