name: Reusable workflow

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
      test_command:
        required: true
        type: string
      build_command:
        required: true
        type: string
    outputs:
      build_version:
        description: "Build version genreated by CI"
        value: ${{ jobs.ci.outputs.build_version }}

permissions:
  contents: read
  packages: write
  id-token: write
  
jobs:
  ci:
    runs-on: ubuntu-latest
    environment: development
    env:
      AWS_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_ROLE: ${{ secrets.AWS_ROLE }}
    outputs:
      build_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: npm
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run test cases
        run: ${{ inputs.test_command }}

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-test-report
          path: junit.xml

      - name: Run build
        run: ${{ inputs.build_command }}
      
      - name: Generate Build Versin
        id: version
        run: echo "version=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prod-build-${{ steps.version.outputs.version }}
          path: dist/
          retention-days: 3
        
      # - name: Build Docker image
      #   run: |
      #     docker build \
      #       -t ghcr.io/${{ github.repository_owner }}/my-react-app:${{ github.sha }} \
      #       -t ghcr.io/${{ github.repository_owner }}/my-react-app:${{ github.ref_name }} \
      #       .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      # - name: Login to GHCR
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT }}:role/${{ env.AWS_ROLE }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      # - name: Push Docker Image
      #   run: |
      #     docker push ghcr.io/${{ github.repository_owner }}/my-react-app:${{ github.sha }}
      #     docker push ghcr.io/${{ github.repository_owner }}/my-react-app:${{ github.ref_name }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            746491202548.dkr.ecr.ap-southeast-2.amazonaws.com/my-react-app:${{ github.sha}}
            746491202548.dkr.ecr.ap-southeast-2.amazonaws.com/my-react-app:${{ github.ref_name}}
    
