name: Output Flow

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Build version number
        id: version
        run: echo "version=1.2.3" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Read Build version
        run: echo "${{ needs.build.outputs.build_version }}"